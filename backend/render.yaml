services:
  - type: web
    name: seeshuraj-avatar-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: SPEECH_KEY
        sync: false
      - key: SPEECH_REGION
        value: westeurope
      - key: SPEECH_VOICE
        value: en-US-AriaNeural
      - key: ALLOWED_ORIGINS
        value: '["https://seeshuraj.github.io"]'
